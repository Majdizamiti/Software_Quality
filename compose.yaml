services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: springz
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-springz-local-only}
    volumes:
      - springz-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-springz-local-only}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/springz?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-springz-local-only}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

  k6:
    image: grafana/k6:latest
    profiles: ["performance"]
    command: ["run", "/scripts/k6-load-test.js"]
    environment:
      BASE_URL: "${BASE_URL:-http://backend:8081}"
    volumes:
      - type: bind
        source: ./performance
        target: /scripts
        read_only: true

volumes:
  springz-db-data:
