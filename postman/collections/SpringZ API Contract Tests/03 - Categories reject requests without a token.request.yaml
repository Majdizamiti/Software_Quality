$kind: http-request
url: "{{baseUrl}}/api/categories"
method: GET
headers:
  Accept: application/json
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Protected categories API returns HTTP 401 without a token', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 3000
